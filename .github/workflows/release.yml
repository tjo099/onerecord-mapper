name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: { contents: write, id-token: write, attestations: write }

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, fetch-tags: true }
      - name: Import maintainer GPG public key
        env:
          GPG_PUBLIC_KEY: ${{ secrets.MAINTAINER_GPG_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PUBLIC_KEY:-}" ]; then
            echo "::error::MAINTAINER_GPG_PUBLIC_KEY secret is not configured. Add the maintainer's ASCII-armored GPG public key as a repository secret before tagging a release."
            exit 1
          fi
          printf '%s\n' "$GPG_PUBLIC_KEY" | gpg --import --batch
      - name: Verify signed tag
        run: |
          # actions/checkout fetch-tags:true brings the tag refs but not always
          # the annotated tag objects. Explicit fetch is bulletproof.
          git fetch --tags --force origin
          git tag -v ${{ github.ref_name }} 2>&1 | tee /tmp/tag-verify.txt
          grep -qE 'good signature|Good signature' /tmp/tag-verify.txt
      - name: Verify release identity
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PACKAGE_VERSION}"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag must point to a commit on origin/main"
            exit 1
          fi
          {
            echo "PACKAGE_NAME=$PACKAGE_NAME"
            echo "PACKAGE_VERSION=$PACKAGE_VERSION"
          } >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.11' }
      # npm trusted publishing requires Node >=22.14 and npm >=11.5.1.
      # Node 24 is npm's recommended GitHub Actions runtime for OIDC publish.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run test:property
      # NE:ONE contract gate — deferred to v0.2 (Phase 14, Tasks 68-71)
      # docker-compose at test/contract/docker-compose.neone.yml ships then.
      - name: Build
        run: bun run build
      - name: Validate published API surface
        run: bun run api:check
      - name: Inspect npm package
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/npm-pack.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'

          const [pack] = JSON.parse(readFileSync('/tmp/npm-pack.json', 'utf8'))
          const files = new Set(pack.files.map(({ path }) => path))
          const required = [
            'dist/api/index.js',
            'dist/api/index.d.ts',
            'CHANGELOG.md',
            'MIGRATING.md',
            'LICENSE',
            'NOTICE',
            'package.json',
          ]
          const missing = required.filter((path) => !files.has(path))
          if (missing.length > 0) {
            throw new Error(`npm package is missing required files: ${missing.join(', ')}`)
          }
          console.log(
            `${pack.name}@${pack.version}: ${pack.entryCount} files, ${pack.size} packed bytes`,
          )
          NODE
      # The "verify committed dist" invariant was removed in v0.1.1 because
      # dist/ is gitignored and consumers run `prepare` (tsc) on install.
      # The inspected npm archive and API-surface check are the release
      # integrity gates.
      - name: SBOM (syft)
        uses: anchore/sbom-action@v0
        with: { artifact-name: 'sbom-${{ github.ref_name }}.spdx.json', format: spdx-json }
      # GitHub Release is created BEFORE attestation. It is the user-visible
      # deliverable and must not be gated behind a flaky Sigstore/Rekor call:
      # v0.3.0's Release was never created because attest-build-provenance@v1
      # hung ~18min and the 30m job timeout cancelled the job one step short
      # of this one (run 25983966832). SBOM still runs first so it can be
      # attached; attestation runs last and independently of the release.
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            sbom-${{ github.ref_name }}.spdx.json
            dist/**
      - name: Publish to npm with trusted publishing
        run: |
          set -euo pipefail
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping immutable npm version"
          else
            npm publish --access public
          fi
      - name: SLSA provenance
        # Step-level timeout so a Sigstore hang fails fast (~5min) instead of
        # silently eating the whole 30m job budget. v2: v1 ran on the now-
        # deprecated Node 20 runtime.
        timeout-minutes: 5
        uses: actions/attest-build-provenance@v2
        with: { subject-path: 'dist/**' }
