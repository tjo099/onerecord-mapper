# test/contract/docker-compose.neone.yml
#
# OLF NE:ONE Server in in-memory mode for the contract suite
# (`bun run test:contract`), used locally and by the Nightly workflow.
#
# NE:ONE is pinned by digest to the image built from upstream
# wg-digitalaircargo/ne-one main @ 4482908f (2026-07-22). Move the digest
# and NEONE_REF in .github/workflows/nightly.yml together.
#
# Keycloak needs the upstream realm export at ./keycloak/neone-realms.json.
# It is OLF-licensed, so it is fetched, not committed (gitignored):
#
#   curl -fsSL --create-dirs -o test/contract/keycloak/neone-realms.json \
#     "https://git.openlogisticsfoundation.org/api/v4/projects/wg-digitalaircargo%2Fne-one/repository/files/src%2Fmain%2Fdocker-compose%2Fkeycloak%2Fneone-realms.json/raw?ref=4482908f13ea2d628e454748dc43fc0d017cdaf2"
#
# No S3 store: MinIO stopped publishing images (quay.io/minio/minio and
# docker.io/minio/minio no longer pull anonymously) and no contract test
# uploads blobs. Upstream also keeps MinIO in an optional overlay.
#
# Ports:
#   8080 — NE:ONE OneRecord API (Bearer token required)
#   8989 — Keycloak (realm `neone`, client `neone-client`)
#   6379 — Redis (NE:ONE cache)
#
# Usage:
#   docker compose -f test/contract/docker-compose.neone.yml up -d --wait
#   bun run test:contract
#   docker compose -f test/contract/docker-compose.neone.yml down -v

services:
  neone:
    image: git.openlogisticsfoundation.org:5050/wg-digitalaircargo/ne-one@sha256:db3f6a9a5db69d0dde52c0465c0633530a17e74cba70502d8d1c55c61cab60ca
    ports:
      - "8080:8080"
    environment:
      REPOSITORY_TYPE: in-memory
      QUARKUS_REST_CLIENT_NOTIFICATION_CLIENT_URL: http://mockserver:1080
      QUARKUS_REST_CLIENT_SUBSCRIPTION_CLIENT_URL: http://mockserver:1080
      LO_ID_CONFIG_HOST: localhost
      LO_ID_CONFIG_SCHEME: http
      LO_ID_CONFIG_PORT: 8080
      # OIDC plumbing per the OLF fix-oidc.yml overlay (closes 3
      # undocumented gaps in the upstream develop-branch base compose).
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak-1:8080/realms/neone
      QUARKUS_OIDC_CLIENT_AUTH_SERVER_URL: http://keycloak-1:8080/realms/neone
      AUTH_ISSUERS_LOCAL_PUBLICKEY_LOCATION: http://keycloak-1:8080/realms/neone/protocol/openid-connect/certs
      AUTH_ISSUERS_LOCAL2_PUBLICKEY_LOCATION: http://keycloak-1:8080/realms/neone2/protocol/openid-connect/certs
      QUARKUS_OIDC_TOKEN_ISSUER: http://localhost:8989/realms/neone
      QUARKUS_OIDC_CLIENT_TOKEN_ISSUER: http://localhost:8989/realms/neone
      QUARKUS_REDIS_HOSTS: redis://redis:6379
    depends_on:
      redis:
        condition: service_started
      keycloak-1:
        condition: service_healthy
    restart: on-failure:10
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/q/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24

  keycloak-1:
    image: quay.io/keycloak/keycloak:22.0
    ports:
      - "8989:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8989
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - "./keycloak:/opt/keycloak/data/import"
    command:
      - start-dev
      - --import-realm
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/master/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 3s
      retries: 24

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
